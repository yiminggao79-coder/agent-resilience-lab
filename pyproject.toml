[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-resilience-lab"
version = "0.1.0"
description = "A local coding agent with persisted execution, scoped tools and explicit recovery boundaries"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-lab = "agent_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_lab*"]
